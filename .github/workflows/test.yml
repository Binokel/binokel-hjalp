name: Tester

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # Playwright 1.56 stöder inte ubuntu-latest (26.04)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installera Playwright och Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Kör testerna
        run: node test/run.js
      - name: Spara skärmbilderna
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skarmbilder
          path: test/skarmbilder/
